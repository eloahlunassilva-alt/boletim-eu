<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletim Digital - 9º Ano</title>
    <!-- Vincula o arquivo de estilos CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Cabeçalho Principal -->
        <header class="header">
            <h1>Boletim Digital</h1>
            <p class="subtitulo">9º Ano — Ensino Fundamental</p>
            <p class="estudante-info">Estudante: <span>Estudante Exemplo</span></p>
        </header>

        <!-- Área Superior com Cards de Resumo -->
        <section class="cards-resumo">
            <div class="card">
                <h3>Média Geral</h3>
                <p id="media-geral" class="valor-card neon-text">-</p>
            </div>
            <div class="card">
                <h3>Total de Faltas</h3>
                <p id="total-faltas" class="valor-card">-</p>
            </div>
            <div class="card">
                <h3>Bom Desempenho</h3>
                <p id="qtd-bom-desempenho" class="valor-card status-bom">-</p>
            </div>
            <div class="card">
                <h3>Atenção</h3>
                <p id="qtd-atencao" class="valor-card status-atencao">-</p>
            </div>
            <div class="card">
                <h3>Frequência Geral</h3>
                <p class="valor-card neon-text">92%</p>
                <span class="subtexto">Frequência adequada</span>
            </div>
        </section>

        <!-- Tabela com Notas e Disciplinas -->
        <section class="tabela-section card-tabela">
            <h2>Notas e Faltas por Disciplina</h2>
            <div class="tabela-responsive">
                <table class="tabela-boletim">
                    <thead>
                        <tr>
                            <th>Disciplina</th>
                            <th>1º Tri</th>
                            <th>2º Tri</th>
                            <th>3º Tri</th>
                            <th>Média</th>
                            <th>Faltas</th>
                            <th>Situação</th>
                        </tr>
                    </thead>
                    <!-- O JavaScript vai preencher estas linhas automaticamente -->
                    <tbody id="tabela-corpo">
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Vincula o arquivo de lógica JavaScript -->
    <script src="script.js"></script>
</body>
</html>
