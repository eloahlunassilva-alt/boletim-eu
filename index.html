<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletim Digital - 9º Ano</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Hydroculus 1 (Esquerda) Estático -->
    <div class="hydroculus-container hydroculus-container-1">
        <div class="hydroculus-externo"></div>
        <div class="hydroculus-interno"></div>
    </div>

    <!-- Hydroculus 2 (Direita) Estático -->
    <div class="hydroculus-container hydroculus-container-2">
        <div class="hydroculus-externo"></div>
        <div class="hydroculus-interno"></div>
    </div>

    <!-- Estátua dos Sete com a Furina à Frente (Canto Inferior Direito) -->
    <div class="estatua-furina-container">
        <img src="https://static.wikia.nocookie.net/gensin-impact/images/c/c2/Statue_of_The_Seven_Hydro.png" class="estatua-dos-sete" alt="Estátua dos Sete Hydro">
        <img src="https://static.wikia.nocookie.net/gensin-impact/images/9/90/Furina_Render.png" class="furina-frente" alt="Furina de Fontaine">
    </div>

    <div class="container">
        <!-- Cabeçalho Principal -->
        <header class="header">
            <h1>Boletim Digital</h1>
            <p class="subtitulo">9º Ano — Ensino Fundamental</p>
            <p class="estudante-info">Estudante: <span>Estudante Exemplo</span></p>
        </header>

        <!-- Área Superior com Cards de Resumo -->
        <section class="cards-resumo">
            <div class="card">
                <h3>Média Geral</h3>
                <p id="media-geral" class="valor-card neon-text">-</p>
            </div>
            <div class="card">
                <h3>Total de Faltas</h3>
                <p id="total-faltas" class="valor-card">-</p>
            </div>
            <div class="card">
                <h3>Bom Desempenho</h3>
                <p id="qtd-bom-desempenho" class="valor-card status-bom">-</p>
            </div>
            <div class="card">
                <h3>Atenção</h3>
                <p id="qtd-atencao" class="valor-card status-atencao">-</p>
            </div>
            <div class="card">
                <h3>Frequência Geral</h3>
                <p class="valor-card neon-text">92%</p>
                <span class="subtexto">Frequência adequada</span>
            </div>
        </section>

        <!-- Tabela com Notas e Disciplinas -->
        <section class="tabela-section card-tabela card">
            <h2>Notas e Faltas por Componente Curricular</h2>
            <div class="tabela-responsive">
                <table class="tabela-boletim">
                    <thead>
                        <tr>
                            <th>Componente Curricular</th>
                            <th>1º Tri</th>
                            <th>2º Tri</th>
                            <th>3º Tri</th>
                            <th>Média</th>
                            <th>Faltas</th>
                            <th>Situação</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-corpo">
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
